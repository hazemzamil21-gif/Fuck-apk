name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Prepare Android Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y aapt2 dx zip findutils coreutils
        curl -L -o android.jar https://github.com/Sable/soot/raw/develop/android-platforms/android-28/android.jar

    - name: Compile and Build Real APK
      run: |
        mkdir -p build/compiled build/apk
        
        # 1. البحث عن كافة ملفات الجافا وترجمتها بالكامل بدون تجاوز الأخطاء الصامتة
        find . -name "*.java" > sources.txt
        if [ -s sources.txt ]; then
          echo "Found Java files, compiling..."
          javac -bootclasspath android.jar -d build/compiled @sources.txt
        else
          echo "No Java files found!"
        fi
        
        # 2. تحويل جميع الكلاسات المترجمة إلى ملف classes.dex واحد يضم كل الوظائف
        if [ -d "build/compiled" ] && [ "$(ls -A build/compiled)" ]; then
          dx --dex --output=classes.dex build/compiled
        fi
        
        # 3. إعداد الـ Manifest والتحقق من وجوده أو إنشاء ملف متوافق
        if [ -f "AndroidManifest.xml" ]; then
          aapt2 link -o build/apk/unsigned.apk --manifest AndroidManifest.xml -I android.jar --auto-add-overlay --allow-reserved-package-id
        else
          echo '<manifest package="com.example.app"></manifest>' > TempManifest.xml
          aapt2 link -o build/apk/unsigned.apk --manifest TempManifest.xml -I android.jar --auto-add-overlay --allow-reserved-package-id
        fi
        
        # 4. حقن ملف classes.dex الفعلي الذي يحتوي على الأكواد داخل الـ APK
        if [ -f "classes.dex" ] && [ -f "build/apk/unsigned.apk" ]; then
          zip -u build/apk/unsigned.apk classes.dex
        fi
        
        # طباعة حجم الملف النهائي للتأكد من احتوائه على الأكواد
        ls -lh build/apk/unsigned.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          build/**/*.apk
          **/*.apk
